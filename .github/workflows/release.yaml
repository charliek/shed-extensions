name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Serialize re-runs against the same tag — better to wait than to abort
# half-uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests
        run: go test ./...

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

      # Mint a release-bot App token scoped to charliek/homebrew-tap for
      # GoReleaser's `brews:` step (formula push). The App must be
      # installed on homebrew-tap (verify via sanity-check-app.yml).
      # Replaces the legacy HOMEBREW_TAP_TOKEN PAT — GoReleaser is
      # token-source-agnostic; it just uses HOMEBREW_TAP_TOKEN from the
      # env for git authentication.
      - name: Mint a homebrew-tap App token
        id: tap
        uses: actions/create-github-app-token@v3
        with:
          client-id:      ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner:        charliek
          repositories: homebrew-tap
          # Defense-in-depth: explicit permission floor on the minted
          # token so a future widening of the App's installation perms
          # doesn't silently broaden what this token can do. GoReleaser
          # only needs contents:write on the tap repo (to push the formula).
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser reads HOMEBREW_TAP_TOKEN from this env var (see
          # .goreleaser.yaml: brews[].repository.token). Feed it the
          # App-minted token instead of a PAT.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}

      # Mint a release-bot App token scoped to charliek/apt-charliek for the
      # publish dispatch — apt-charliek pulls the new shed-machine-rc .deb from
      # this release into apt.stridelabs.ai. The App must be installed on
      # apt-charliek (same App that shed's release dispatches with).
      - name: Mint an apt-charliek App token
        if: success()
        id: apt
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          owner: charliek
          repositories: apt-charliek
          # POST /repos/.../dispatches requires contents:write.
          permission-contents: write

      - name: Trigger apt-charliek publish
        if: success()
        env:
          GH_TOKEN: ${{ steps.apt.outputs.token }}
        run: |
          # apt-charliek's publish workflow is idempotent (it re-scans every
          # tracked package on each run), so a missed dispatch self-heals on the
          # next release — but retry so a transient API blip doesn't leave the new
          # .deb unindexed until then.
          for attempt in 1 2 3; do
            if gh api repos/charliek/apt-charliek/dispatches \
              --method POST \
              -f event_type=publish \
              -F "client_payload[package]=shed-machine-rc" \
              -F "client_payload[tag]=${{ github.ref_name }}" 2>&1; then
              echo "::notice::Watch apt publish at https://github.com/charliek/apt-charliek/actions"
              exit 0
            fi
            echo "::warning::dispatch attempt $attempt failed; sleeping $((attempt * 5))s"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-charliek dispatch failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

  docker:
    needs: release
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: image_tags
        run: |
          {
            echo 'value<<EOF'
            echo "ghcr.io/charliek/shed-extensions:${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
              echo "ghcr.io/charliek/shed-extensions:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.image_tags.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
